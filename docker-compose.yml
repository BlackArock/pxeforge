services:
  iventoy:
    image: szabis/iventoy:latest
    container_name: pxeforge-iventoy
    network_mode: host
    privileged: true
    restart: unless-stopped
    environment:
      - AUTO_START_PXE=false
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./data/isos:/opt/iventoy/iso
      - ./data/configs:/opt/iventoy/data
      - ./data/logs/iventoy:/opt/iventoy/log

  backend:
    build: ./backend
    container_name: pxeforge-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - iventoy

  frontend:
    build: ./frontend
    container_name: pxeforge-frontend
    restart: unless-stopped
    expose:
      - "80"

  aria2:
    image: p3terx/aria2-pro
    container_name: pxeforge-aria2
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - RPC_SECRET=${ARIA2_RPC_SECRET}
      - RPC_PORT=6800
      - LISTEN_PORT=6888
    volumes:
      - ./data/isos:/downloads
      - ./data/configs/aria2:/config
    ports:
      - "6800:6800"
      - "6888:6888"
      - "6888:6888/udp"

  samba:
    image: dperson/samba
    container_name: pxeforge-samba
    restart: unless-stopped
    environment:
      - USER=${SAMBA_USER};${SAMBA_PASSWORD}
      - SHARE=ISOS;/mount;yes;no;no;${SAMBA_USER}
    volumes:
      - ./data/isos:/mount
    ports:
      - "1399:139"
      - "4459:445"

  nginx:
    image: nginx:alpine
    container_name: pxeforge-nginx
    restart: unless-stopped
    ports:
      - "8099:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
